name: Testing

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: composer install

      - name: PHPStan check
        run: vendor/bin/phpstan analyse

      - name: PHP Compatibility check
        run: vendor/bin/phpcs -p src --standard=PHPCompatibilityWP --runtime-set testVersion 8.2-

  build:
    name: PHP ${{ matrix.php-version }}, WordPress ${{ matrix.wp-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.6', '8.5', '8.4', '8.3', '8.2' ]
        # 6.9: without the Secrets API of WordPress.
        # latest: the current release.
        # nightly: the next release - with the Secrets API since 7.2.
        wp-version: [ '6.9', 'latest', 'nightly' ]
        exclude:
          # PHP 8.6 deprecates spl_object_hash(), which WordPress before 7.1 calls for
          # every hook - our phpunit.xml.dist turns each of these deprecations into an error.
          - php-version: '8.6'
            wp-version: '6.9'
    services:
      database:
        image: mysql:latest
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpunit-polyfills:1.1
          extensions: mbstring, xml, zip, intl, pdo, mysql, sodium
          coverage: none

      - name: Install dependencies
        run: composer install

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Setup tests
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 ${{ matrix.wp-version }} true

      - name: Run tests (single site)
        run: composer test

      - name: Run tests (multisite)
        run: composer test-multisite

  without-sodium:
    name: PHP ${{ matrix.php-version }}, WordPress ${{ matrix.wp-version }}, without ext-sodium
    runs-on: ubuntu-latest
    # The PHP of setup-php has sodium compiled in statically, so ":sodium" can not
    # disable it there. The official PHP images build sodium as a shared module and
    # only enable it by an ini file - removing that file disables the extension.
    container: php:${{ matrix.php-version }}-cli
    strategy:
      fail-fast: false
      matrix:
        # the oldest and the newest supported version of PHP.
        php-version: [ '8.5', '8.2' ]
        # 6.9: without the Secrets API of WordPress, nightly: with it - which uses sodium_compat as well then.
        wp-version: [ '6.9', 'nightly' ]
    services:
      # Reachable from the job container by the host name "database".
      database:
        image: mysql:latest
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
    steps:
      - name: Install system packages
        run: apt-get update && apt-get install -y --no-install-recommends git unzip subversion

      - name: Check out source code
        uses: actions/checkout@v7

      - name: Setup PHP
        run: |
          docker-php-ext-install mysqli
          # Disable sodium: WordPress loads its sodium_compat instead.
          rm /usr/local/etc/php/conf.d/docker-php-ext-sodium.ini
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          php -v
          php -m

      - name: Check that the extension sodium is missing
        run: php -r 'if ( extension_loaded( "sodium" ) || function_exists( "sodium_crypto_box" ) ) { echo "The extension sodium is loaded.\n"; exit( 1 ); }'

      - name: Install dependencies
        run: composer install

      - name: Setup tests
        run: bash bin/install-wp-tests.sh wordpress_tests root root database ${{ matrix.wp-version }} true

      - name: Run tests (single site)
        run: composer test

      - name: Run tests (multisite)
        run: composer test-multisite

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    services:
      database:
        image: mysql:latest
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: phpunit-polyfills:1.1
          extensions: mbstring, xml, zip, intl, pdo, mysql, sodium
          coverage: pcov

      - name: Install dependencies
        run: composer install

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Setup tests
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 nightly true

      - name: Coverage (single site)
        run: composer test-coverage

      - name: Coverage (multisite)
        run: composer test-coverage-multisite